services:
  - type: web
    name: mitra-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: VECTOR_STORE_PATH
        value: data/vector_store
      - key: PERMANENT_DOCUMENT_PATH
        value: data/permanent_documents
      - key: TEMPORARY_DOCUMENT_PATH
        value: data/temporary_documents
      - key: RAG_TOP_K
        value: "5"
      - key: RAG_SCORE_THRESHOLD
        value: "0.35"
